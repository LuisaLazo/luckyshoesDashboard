
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lucky Shoes | Dashboard Estratégico</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- MENÚ LATERAL -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0">

        <div>
            <!-- MARCA -->
            <div class="px-5 py-6 border-b border-slate-800 flex items-center gap-3">

                <div class="w-10 h-10 rounded-xl bg-rose-600 flex items-center justify-center text-white font-bold text-lg">
                    LS
                </div>

                <div>
                    <h1 class="text-white font-bold text-lg">
                        Lucky Shoes
                    </h1>
                    <p class="text-xs text-rose-400">
                        Calzado femenino
                    </p>
                </div>
            </div>

            <!-- NAVEGACIÓN -->
            <nav class="px-4 py-6 space-y-2">

                <button
                    onclick="cambiarVista('general')"
                    id="nav-general"
                    class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors">

                    <i data-lucide="layout-dashboard"
                       class="w-5 h-5"></i>

                    <span>Vista general</span>
                </button>

                <button
                    onclick="cambiarVista('financiera')"
                    id="nav-financiera"
                    class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors">

                    <i data-lucide="trending-up"
                       class="w-5 h-5 text-rose-400"></i>

                    <span>Financiera</span>
                </button>

                <button
                    onclick="cambiarVista('cliente')"
                    id="nav-cliente"
                    class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors">

                    <i data-lucide="heart-handshake"
                       class="w-5 h-5 text-rose-400"></i>

                    <span>Clientes</span>
                </button>

                <button
                    onclick="cambiarVista('procesos')"
                    id="nav-procesos"
                    class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors">

                    <i data-lucide="layers"
                       class="w-5 h-5 text-rose-400"></i>

                    <span>Procesos internos</span>
                </button>

                <button
                    onclick="cambiarVista('aprendizaje')"
                    id="nav-aprendizaje"
                    class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-colors">

                    <i data-lucide="sparkles"
                       class="w-5 h-5 text-rose-400"></i>

                    <span>Aprendizaje y crecimiento</span>
                </button>

            </nav>
        </div>

        <!-- RESTAURAR DATOS -->
        <div class="p-4 border-t border-slate-700">

            <button
                onclick="resetearDatos()"
                class="w-full flex items-center justify-center gap-2
                       px-4 py-3 rounded-xl text-sm font-medium
                       text-white bg-slate-700 hover:bg-slate-600 transition">

                <i data-lucide="rotate-ccw"
                   class="w-4 h-4"></i>

                Restaurar datos
            </button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">

        <header class="bg-white border-b border-slate-200 px-8 py-5 sticky top-0 z-10">

            <h2 id="titulo-vista"
                class="text-2xl font-bold text-slate-900">
                Panel Ejecutivo de Gerencia
            </h2>

            <p id="subtitulo-vista"
               class="text-sm text-slate-500 mt-1">
                Seguimiento de indicadores estratégicos
            </p>
        </header>

        <!-- VISTAS DINÁMICAS -->
        <div id="contenedor-principal"
             class="p-6 max-w-7xl w-full mx-auto space-y-6">
        </div>

    </main>

    <!-- MODAL DE SIMULACIÓN -->
    <div id="modal-simulador"
         class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm
                hidden items-center justify-center z-50 p-4">

        <div class="bg-white rounded-2xl max-w-md w-full
                    p-6 shadow-2xl border border-slate-100">

            <div class="flex justify-between items-center
                        border-b border-slate-100 pb-4 mb-4">

                <h3 class="font-bold text-lg text-slate-900
                           flex items-center gap-2">

                    <i data-lucide="sliders"
                       class="w-5 h-5 text-rose-600"></i>

                    Simular indicador
                </h3>

                <button onclick="cerrarModal()"
                        class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div id="modal-contenido" class="space-y-4">
            </div>

            <div class="mt-6 flex justify-end gap-3">

                <button onclick="cerrarModal()"
                        class="px-4 py-2 text-sm font-medium
                               text-slate-600 hover:bg-slate-100 rounded-xl">
                    Cancelar
                </button>

                <button onclick="guardarSimulacion()"
                        class="px-5 py-2 text-sm font-semibold
                               text-white bg-rose-600
                               hover:bg-rose-700 rounded-xl shadow-md">
                    Aplicar cambios
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
